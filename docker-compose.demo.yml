services:
  localstack:
    image: localstack/localstack:4.6.0
    container_name: sentinelci-localstack
    environment:
      SERVICES: s3,sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: sentinelci-artifacts
      SNS_TOPIC_NAME: sentinelci-notifications
      SQS_QUEUE_NAME: sentinelci-events
    ports:
      - "4566:4566"
    volumes:
      - "./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro"
      - "sentinelci-localstack-data:/var/lib/localstack"
    networks:
      - sentinelci-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: sentinelci-app:latest
    container_name: sentinelci-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.txt
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: sentinelci-artifacts
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:sentinelci-notifications
      SQS_QUEUE_URL: http://localstack:4566/000000000000/sentinelci-events
    networks:
      - sentinelci-network

  proxy:
    image: sentinelci-proxy:latest
    container_name: sentinelci-proxy
    build:
      context: .
      dockerfile: Dockerfile.proxy
    depends_on:
      - app
    ports:
      - "8080:80"
    networks:
      - sentinelci-network

networks:
  sentinelci-network:
    name: sentinelci-network

volumes:
  sentinelci-localstack-data:
